appId: kg.college.educational-plan
productName: Расписание колледжа
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# Нативный .node-модуль (better-sqlite3) должен остаться распакованным —
# Node не умеет грузить .node-бинарники из asar-архива.
asarUnpack:
  - '**/*.node'

# Миграции читаются с диска в рантайме (drizzle-orm/better-sqlite3/migrator),
# поэтому кладём их рядом со сборкой, а не внутрь asar.
extraResources:
  - from: drizzle
    to: drizzle
    filter:
      - '**/*'
      - '!meta/*.json.bak'
  # Демо-колледж, разворачиваемый при первом запуске (`npm run demo:db`).
  # Файл генерируется, в git не лежит — без него сборка просто выйдет пустой.
  - from: resources/demo
    to: demo
    filter:
      - 'college.db'

mac:
  target:
    - target: dir
      arch:
        - arm64
        - x64
  category: public.app-category.education

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Этап 8: завуч ставит приложение без прав администратора — perMachine: false
  # (по умолчанию у electron-builder, но фиксируем явно) кладёт установку
  # в %LOCALAPPDATA%, где обычный пользователь Windows и так может писать.
  perMachine: false
